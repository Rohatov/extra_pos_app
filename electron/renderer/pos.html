<!doctype html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' 'unsafe-eval' qrc: file:; connect-src *; img-src * data: blob:; media-src 'self' blob:; font-src 'self' data:;">
	<title>POS Awesome</title>
	<style>
		/* Loading screen */
		body { margin: 0; font-family: 'Segoe UI', system-ui, sans-serif; background: #101828; color: #e2e8f0; }
		#pos-loading {
			display: flex; flex-direction: column; align-items: center; justify-content: center;
			min-height: 100vh; gap: 16px;
		}
		#pos-loading .spinner {
			width: 48px; height: 48px; border: 4px solid rgba(255,255,255,0.1);
			border-top-color: #22d3ee; border-radius: 50%;
			animation: spin 0.8s linear infinite;
		}
		@keyframes spin { to { transform: rotate(360deg); } }
		#pos-loading .status { color: #94a3b8; font-size: 14px; }
		/* Hide loading once app mounts */
		.app-loaded #pos-loading { display: none; }
	</style>
	<!-- POS Awesome CSS (built by vite) -->
	<link rel="stylesheet" href="../dist/posawesome.css" />
	<script src="./bridge-init.js"></script>
</head>
<body>
	<!-- Loading indicator -->
	<div id="pos-loading">
		<div class="spinner"></div>
		<div class="status" id="load-status">Initializing POS...</div>
	</div>

	<!-- Vue app mount point -->
	<div class="main-section"></div>

	<!-- Frappe shim — must load BEFORE the Vue app -->
	<script src="../frappe-shim.js"></script>

	<script>
		// Wait for frappe shim to boot, then launch the Vue app
		(async function () {
			const statusEl = document.getElementById("load-status");

			try {
				statusEl.textContent = "Preparing desktop bridge...";
				await window._desktopBridgeReady;

				statusEl.textContent = "Loading configuration...";
				await window._frappeShimReady;

				statusEl.textContent = "Starting POS application...";

				// Import the built POS bundle (ES module)
				// This executes posapp.js which registers frappe.PosApp.posapp class
				await import("../dist/posawesome.js");

				// Instantiate the POS app (same as frappe's page loader does)
				if (frappe.PosApp && frappe.PosApp.posapp) {
					new frappe.PosApp.posapp({
						parent: { page: document.body },
					});
				}

				// Mark app as loaded
				document.body.classList.add("app-loaded");
			} catch (err) {
				console.error("[POS] Failed to start:", err);
				statusEl.textContent = "Error: " + (err.message || "Failed to load POS application");
				statusEl.style.color = "#f87171";
			}
		})();
	</script>
</body>
</html>
